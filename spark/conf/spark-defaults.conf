spark.jars.packages                           org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,software.amazon.awssdk:bundle:2.20.18,software.amazon.awssdk:url-connection-client:2.20.18
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                rest
spark.sql.catalog.iceberg.uri                 ${ICEBERG_REST_URL}
spark.sql.catalog.iceberg.warehouse           ${ICEBERG_WAREHOUSE}
spark.sql.catalog.iceberg.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint        ${MINIO_ENDPOINT}
spark.sql.catalog.iceberg.s3.path-style-access true
spark.hadoop.fs.s3a.endpoint                  ${MINIO_ENDPOINT}
spark.hadoop.fs.s3a.access.key               ${MINIO_ROOT_USER}
spark.hadoop.fs.s3a.secret.key               ${MINIO_ROOT_PASSWORD}
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
