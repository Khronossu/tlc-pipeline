spark.jars.packages                           org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,software.amazon.awssdk:bundle:2.26.31,software.amazon.awssdk:url-connection-client:2.26.31
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                rest
spark.sql.catalog.iceberg.uri                 http://iceberg-rest:8181
spark.sql.catalog.iceberg.warehouse           s3://warehouse/
spark.sql.catalog.iceberg.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint        http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.s3.access-key-id   minioadmin
spark.sql.catalog.iceberg.s3.secret-access-key minioadmin
spark.hadoop.fs.s3a.endpoint                  http://minio:9000
spark.hadoop.fs.s3a.access.key               minioadmin
spark.hadoop.fs.s3a.secret.key               minioadmin
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.executorEnv.PYTHONPATH                 /opt/project
spark.yarn.appMasterEnv.PYTHONPATH           /opt/project
spark.driver.extraJavaOptions                -Dio.netty.noUnsafe=true -Dio.netty.noKeySetOptimization=true -Dio.netty.recycler.maxCapacityPerThread=0 -Djdk.reflect.useDirectMethodHandle=false -Darrow.enable_unsafe_memory_access=false -Darrow.memory.debug.allocator=false
spark.executor.extraJavaOptions              -Dio.netty.noUnsafe=true -Dio.netty.noKeySetOptimization=true -Dio.netty.recycler.maxCapacityPerThread=0 -Djdk.reflect.useDirectMethodHandle=false -Darrow.enable_unsafe_memory_access=false -Darrow.memory.debug.allocator=false
spark.sql.parquet.enableVectorizedReader     false
spark.sql.orc.enableVectorizedReader        false
spark.sql.iceberg.vectorization.enabled     false
spark.sql.defaultCatalog                    iceberg
spark.driver.memory                         2g
spark.executor.memory                       2g
spark.sql.shuffle.partitions                4
spark.default.parallelism                   4
